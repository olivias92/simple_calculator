name: CI Pipeline
on:
  push:
      branches:
      - main
  pull_request:
    branches:
    - main
  workflow_dispatch: 
    
jobs:
  build-and-test:
   runs-on: ubuntu-22.04

   steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run unit tests
        run: python -m pytest tests/
